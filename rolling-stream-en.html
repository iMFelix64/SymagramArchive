<!DOCTYPE html>
<html lang="en" data-rolling-locale="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rolling Stream / SymagramArchive</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./rolling-stream-en.css?v=20260707-snappy-english-branch-match-1" />
  </head>
  <body>
    <main class="rolling-app" aria-label="SymagramArchive rolling stream" data-debug-label="main.rolling-app">
      <header class="rolling-topbar" aria-label="Rolling stream toolbar" data-debug-label="header.rolling-topbar">
        <div class="rolling-topbar-path" data-debug-label="div.rolling-topbar-path">
          <span>ARCHIVE /</span>
          <span class="rolling-topbar-active">ROLLING STREAM</span>
        </div>
        <div class="rolling-topbar-mode" data-debug-label="div.rolling-topbar-mode">
          <span>SPRING</span>
          <span>3:2</span>
        </div>
      </header>

      <div class="rolling-divider" aria-hidden="true"></div>

      <section class="rolling-hero" data-debug-label="section.rolling-hero">
        <h1 class="rolling-title">Products</h1>
        <p class="rolling-intro">
          Projects 01 to 04 are arranged as one rolling stream. Each image responds to scroll with soft scale feedback.
        </p>
      </section>

      <div class="rolling-divider" aria-hidden="true"></div>

      <section class="rolling-projects" aria-label="project rolling stream" data-debug-label="section.rolling-projects"></section>
    </main>

    <script src="./archive-data-en.js?v=20260707-snappy-bilingual-1"></script>
    <script src="./image-protection.js?v=20260623-loading-priority-1"></script>
    <script src="./rolling-stream-en.js?v=20260707-snappy-english-branch-match-1"></script>
  </body>
</html>
